name: Compiler l'application Windows (Coordination)

on:
  workflow_dispatch:
  push:
    branches: [claude/local-windows-app-excel-wdt64c]
    paths:
      - "Coordination-SAMSAH.html"
      - "electron/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm install

      - name: Compiler le .exe portable
        run: npm run build:win-portable

      - name: Publier le .exe compilé
        uses: actions/upload-artifact@v4
        with:
          name: Coordination-portable-windows
          path: electron/dist/Coordination-portable.exe
          if-no-files-found: error

      - name: Publier une release téléchargeable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete portable-latest --yes --cleanup-tag || true
          gh release create portable-latest dist/Coordination-portable.exe \
            --title "Coordination — dernier .exe portable" \
            --notes "Compilé automatiquement depuis le commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
